    <script>

        async function createEmployee() {
            const employee = {
                nombre: document.getElementById('nombre').value,
                tipo_documento: document.getElementById('tipo_documento').value,
                documento: document.getElementById('documento').value,
                correo: document.getElementById('correo').value,

            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error de conexión: ' + error.message);
            }
        }

        async function loadEmployees() {
            try {
                console.log('📥 Cargando empleados...');
                const response = await fetch(API_BASE);
                const employees = await response.json();

                console.log('📋 Empleados:', employees);

                const listDiv = document.getElementById('employeesList');
                listDiv.innerHTML = '';

                if (Array.isArray(employees) && employees.length > 0) {
                    employees.forEach(emp => {
                        const card = document.createElement('div');
                        card.className = `employee-card ${emp.estado === 'Activo' ? 'active' : 'inactive'}`;
                        card.innerHTML = `
                            <h4>${emp.nombre} ${emp.apellido}</h4>
                            <p><strong>ID:</strong> ${emp.id}</p>
                            <p><strong>Documento:</strong> ${emp.tipoDocumento || emp.tipo_documento} ${emp.documento}</p>
                            <p><strong>Correo:</strong> ${emp.correo}</p>
                            <p><strong>Estado:</strong> ${emp.estado}</p>
                            <p><strong>Rol:</strong> ${emp.rol}</p>
                            <button class="btn-danger" onclick="deleteEmployee(${emp.id})">Eliminar</button>
                            <button class="btn-warning" onclick="toggleStatus(${emp.id}, '${emp.estado}')">
                                ${emp.estado === 'Activo' ? 'Desactivar' : 'Activar'}
                            </button>
                        `;
                        listDiv.appendChild(card);
                    });
                } else {
                    listDiv.innerHTML = '<p>No hay empleados registrados.</p>';
                }
            } catch (error) {
                console.error('Error cargando empleados:', error);
                document.getElementById('employeesList').innerHTML = '<p>Error cargando empleados.</p>';
            }
        }

        async function deleteEmployee(id) {
            if (!confirm('¿Seguro que deseas eliminar este empleado?')) return;

            try {
                const response = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('✅ Empleado eliminado!');
                    loadEmployees();
                } else {
                    alert('❌ Error eliminando empleado');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error de conexión');
            }
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'Activo' ? 'Inactivo' : 'Activo';

            try {
                const response = await fetch(`${API_BASE}/${id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: newStatus })
                });

                if (response.ok) {
                    alert(`✅ Estado cambiado a ${newStatus}!`);
                    loadEmployees();
                } else {
                    alert('❌ Error cambiando estado');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error de conexión');
            }
        }

        async function getEmployeeById() {
            const id = document.getElementById('searchId').value;
            if (!id) {
                alert('Ingresa un ID');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/${id}`);
                const employee = await response.json();

                const detailDiv = document.getElementById('employeeDetail');
                if (response.ok) {
                    detailDiv.innerHTML = `
                        <div class="employee-card ${employee.estado === 'Activo' ? 'active' : 'inactive'}">
                            <h4>${employee.nombre} ${employee.apellido}</h4>
                            <pre>${JSON.stringify(employee, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    detailDiv.innerHTML = '<p>Empleado no encontrado.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('employeeDetail').innerHTML = '<p>Error de conexión.</p>';
            }
        }
